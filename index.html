<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>

<body>

    <dialog id="intro-modal">
        <p>Welcome to my instrument!</p>
        <button id="intro-modal-close">OK</button>
    </dialog>

    <header>
        <h1>Audio Instrument</h1>
    </header>

    <main>
        <button id="test-button" class="whiteKey" data-note="C4">make sound</button>
        <button id="key-test" class="whiteKey" data-note="D4">key</button>
        <!-- bring in pre-rendered audio file -->
         <audio id="audio-track" src="./assests/audio/p-hase_leap.mp3"></audio>
     <button id="playback-button">Play</button>
     <!-- random location button -->
      <button id="random-location">random</button>
      <!--  image for spatial control; -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Augusta_Dohlmann_Wild_flowers_%281905%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
        alt="painting of flowers in a vase" id="flowerpainting" data-note="a3">
    </main>

</body>
</html>
