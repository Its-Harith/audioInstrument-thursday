<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloom: a lotus pond that grows with your focus</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

  <!-- Decorative water background (animated in CSS) -->
  <div id="water" aria-hidden="true"></div>

  <!-- aria-live so screen readers announce the phase changes -->
  <p id="status" aria-live="polite">Set your session, then press start</p>

  <!-- Setup screen: Pomodoro (25 / 5) is selected by default -->
  <main id="setup">
    <h1>Bloom</h1>
    <p class="intro">A lotus pond that grows while you focus. Listen to the harmony build, then play the pond during your break.</p>

    <form id="settings">
      <div class="presets" role="group" aria-label="Timer presets">
        <button type="button" class="preset" data-preset="pomodoro" aria-pressed="true">Pomodoro <span>25 / 5 min</span></button>
        <button type="button" class="preset" data-preset="long" aria-pressed="false">Long focus <span>50 / 10 min</span></button>
        <button type="button" class="preset" data-preset="demo" aria-pressed="false">Quick demo <span>15 / 15 sec</span></button>
      </div>

      <div class="fields">
        <label for="studyMinutes">Study time (minutes)
          <input id="studyMinutes" type="number" min="0.25" max="180" step="any" value="25" required>
        </label>
        <label for="breakMinutes">Break time (minutes)
          <input id="breakMinutes" type="number" min="0.25" max="60" step="any" value="5" required>
        </label>
      </div>

      <button id="start" type="submit">Start session</button>
    </form>
  </main>

  <!-- Shown when the break finishes -->
  <button id="again" type="button" hidden>New session</button>

</body>
</html>
