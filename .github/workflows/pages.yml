name: Publish every branch to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth 0 downloads every branch, not just the one that was pushed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site with each branch in its own folder
        run: |
          mkdir _site
          # the default branch (your work index) goes at the site root
          git archive "refs/remotes/origin/${{ github.event.repository.default_branch }}" | tar -x -C _site
          # every branch also goes in a folder named after the branch
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            mkdir -p "_site/$branch"
            git archive "$ref" | tar -x -C "_site/$branch"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
